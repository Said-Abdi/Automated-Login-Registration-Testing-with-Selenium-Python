<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>Create Account</h1>

  <label>Name</label>
  <input id="name" type="text">

  <label>Email</label>
  <input id="email" type="text">

  <label>Password</label>
  <input id="password" type="password">

  <label>Confirm Password</label>
  <input id="confirm_password" type="password">

  <button id="register_btn" type="button">Register</button>
  <div id="message"></div>
  <a href="login.html">Already registered? Login</a>
</div>

<script>
document.getElementById("register_btn").addEventListener("click", () => {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm_password").value;
  const message = document.getElementById("message");

  if (!name || !email || !password || !confirmPassword) {
    message.textContent = "All fields are required.";
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    message.textContent = "Enter a valid email address.";
    return;
  }

  if (password.length < 8) {
    message.textContent = "Password must be at least 8 characters.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  localStorage.setItem("qa_demo_user", JSON.stringify({name, email, password}));
  message.textContent = "Registration successful!";
});
</script>
</body>
</html>
